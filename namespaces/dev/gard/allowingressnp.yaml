  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 
        - 35.191.0.0/16
    - ipBlock:
        cidr: 
        - 130.211.0.0/22
    - ipBlock:
        cidr: 
        - 209.85.152.0/22
    - ipBlock:
        cidr: 
        - 209.85.204.0/22
