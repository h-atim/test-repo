apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: store-healthcheck
spec:
  default:
    checkIntervalSec: 30
    timeoutSec: 30
    healthyThreshold: 2
    unhealthyThreshold: 5
    logConfig:
      enabled: true
    config:
      type: HTTP
      httpHealthCheck:
        host: "store.example.com"
        port: 8080
        requestPath: /
  targetRef:
    group: ""
    kind: Service
    name: store-v1